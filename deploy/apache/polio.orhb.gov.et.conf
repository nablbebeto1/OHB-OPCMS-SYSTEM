# Apache2 VirtualHost for Oromia Health Bureau Polio Campaign Management System (OHB-OPCMS)
# Public Domain: https://polio.orhb.gov.et
# Required Apache modules:
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#
# IMPORTANT:
# - Do NOT overwrite existing VirtualHosts (odmc.orhb.gov.et, irb.orhb.gov.et, or Moodle on port 8888).
# - ProxyPass /api MUST be declared BEFORE ProxyPass / so API calls hit FastAPI (127.0.0.1:4949)
#   instead of falling back to the frontend SPA (127.0.0.1:1119) and returning index.html.

<VirtualHost *:80>
    ServerName polio.orhb.gov.et

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName polio.orhb.gov.et

    # Preserve existing server SSL certificates (verify exact paths on odmcserver)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/polio.orhb.gov.et/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/polio.orhb.gov.et/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # 1. Server-Sent Events (SSE) stream -> FastAPI (disable buffering / reuse)
    ProxyPass /api/events http://127.0.0.1:4949/api/events flushpackets=on disablereuse=On connectiontimeout=10 timeout=86400
    ProxyPassReverse /api/events http://127.0.0.1:4949/api/events

    # 2. FastAPI REST API -> 127.0.0.1:4949 (MUST precede ProxyPass /)
    ProxyPass /api/ http://127.0.0.1:4949/api/ connectiontimeout=10 timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:4949/api/
    ProxyPass /api http://127.0.0.1:4949/api connectiontimeout=10 timeout=120
    ProxyPassReverse /api http://127.0.0.1:4949/api

    # 3. Optional FastAPI OpenAPI / Docs routes
    ProxyPass /docs http://127.0.0.1:4949/docs
    ProxyPassReverse /docs http://127.0.0.1:4949/docs
    ProxyPass /openapi.json http://127.0.0.1:4949/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:4949/openapi.json

    # 4. React / Vite Frontend -> 127.0.0.1:1119 (catch-all LAST; includes SPA /preview/<token>)
    ProxyPass / http://127.0.0.1:1119/
    ProxyPassReverse / http://127.0.0.1:1119/

    ErrorLog ${APACHE_LOG_DIR}/polio-opcms-error.log
    CustomLog ${APACHE_LOG_DIR}/polio-opcms-access.log combined
</VirtualHost>
</IfModule>
