server {
    listen 1119;
    listen 80;
    server_name 196.188.173.157 192.168.100.11 polio.orhb.gov.et _;

    client_max_body_size 30M;

    # Static Frontend Build (Vite dist/)
    root /opt/ohb-opcms/dist;
    index index.html;

    # Server-Sent Events (Live Command Room Updates)
    location /api/events {
        proxy_pass http://127.0.0.1:4949/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # FastAPI Backend Reverse Proxy (127.0.0.1:4949)
    location /api/ {
        proxy_pass http://127.0.0.1:4949/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA Fallback (supports /command-room and deep links)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
